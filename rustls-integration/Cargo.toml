[package]
name = "rustls-integration"
description = "TLS 1.3 deck key schedule (draft-sullivan-tls-xof-ciphers-00) wired into a rustls fork"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The dependency-free reference schedule. The rustls seams call into this crate
# for every key-schedule computation.
deck-schedule = { path = "../deck-schedule" }

# rustls 0.23.41 with the aws-lc-rs backend. The source is our vendored fork
# under rustls/, substituted via `[patch.crates-io]` in the workspace root so the
# fork stays its own workspace (not a member of ours). aws-lc-rs (not ring) is
# required for the post-quantum key exchange the deck schedule targets: pure
# ML-KEM (`kx_group::MLKEM768`, draft-ietf-tls-mlkem) — a single KEM shared
# secret, which the deck absorbs as one `Absorb("dh", …)` (draft §7.3) with no
# hybrid-ordering problem — and, later, hybrids like `X25519MLKEM768`.
rustls = { version = "=0.23.41", default-features = false, features = ["aws_lc_rs", "std", "logging"] }

[dev-dependencies]
# Loopback interop test: self-signed certs + in-memory transport.
# `default-features = false` + `aws_lc_rs` keeps rcgen from pulling ring back in
# (its default feature set uses ring), so the whole build stays on one backend.
rcgen = { version = "0.13", default-features = false, features = ["pem", "aws_lc_rs"] }

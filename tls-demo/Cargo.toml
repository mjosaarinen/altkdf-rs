[package]
name = "tls-demo"
description = "Stage 5 demo: a live TLS 1.3 handshake on a deck cipher suite (draft-sullivan-tls-xof-ciphers-00)"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "deck-server"
path = "src/bin/server.rs"

[[bin]]
name = "deck-client"
path = "src/bin/client.rs"

[dependencies]
# The deck CryptoProvider + config helpers (Stage 4). Re-exports `rustls` and
# `deck_schedule`, but we also depend on `rustls` directly for ergonomic paths.
rustls-integration = { path = "../rustls-integration" }
rustls = { version = "=0.23.41", default-features = false, features = ["aws_lc_rs", "std", "logging"] }
# Self-signed demo certs (ECDSA-P256). `aws_lc_rs` keeps the whole build on one
# backend (no ring pulled in), matching the rustls fork.
rcgen = { version = "0.13", default-features = false, features = ["pem", "aws_lc_rs"] }

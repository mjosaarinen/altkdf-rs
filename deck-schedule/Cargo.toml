[package]
name = "deck-schedule"
description = "Reference implementation of the TLS 1.3 deck key schedule (draft-sullivan-tls-xof-ciphers-00)"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# One dependency: `zeroize`, to erase live secret state on drop (draft §15.7.2.2)
# — stage/traffic secrets, the sponge capacity, and the framed deck accumulators.
# It is itself dependency-free and no_std, so the Keccak permutation and sponge
# stay implemented in-crate and auditable against the draft, and `cargo test`
# still works with no network access.
[features]
# Enables the Keccak-p permutation counter used by `examples/invocations.rs`
# (the draft Appendix A.1 permutation-count benchmark). Off by default, so normal
# builds carry no counter and no per-permutation branch.
bench = []

# The benchmark example needs the counter, so it is only built with `--features
# bench` (otherwise `cargo test`/`build` would fail to find `keccak::count`).
[[example]]
name = "invocations"
required-features = ["bench"]

[dependencies]
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

[dev-dependencies]
